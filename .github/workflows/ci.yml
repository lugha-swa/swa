# Jina la utendaji
name: Majaribio

# Wakati wa kuendesha
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kazi za kufanya
jobs:
  jaribu:
    name: Jenga na Jaribu
    runs-on: ubuntu-latest

    steps:
      - name: Pakua msimbo
        uses: actions/checkout@v4

      - name: Weka Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Weka Clang na LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-18-dev
          echo "LLVM_CONFIG=llvm-config-18" >> $GITHUB_ENV

      - name: Mnyororo wa kwanza (baiti za mkono)
        run: bash gharama/jenga-kwanza.sh

      - name: Jenga
        run: cargo build --release

      - name: Jaribu
        run: cargo test
