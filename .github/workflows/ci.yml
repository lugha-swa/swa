# Jina la utendaji
name: Majaribio

# Wakati wa kuendesha
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kazi za kufanya
jobs:
  # Mnyororo wa Swa pekee -- hauhitaji Rust, LLVM, wala clang.
  # Hii ndiyo lango kuu: hukagua mzizi wa uaminifu, fixpoint, na
  # programu zote za MANIFEST kwenye minyororo yote miwili.
  mnyororo:
    name: Mnyororo wa Swa
    runs-on: ubuntu-latest

    steps:
      - name: Pakua msimbo
        uses: actions/checkout@v4

      - name: Mwanzo (kwanza + kizinduzi pekee -> mjenzi kutoka chanzo chake)
        run: ./msingi/kizinduzi.bin gharama/mwanzo.kizinduzi

      - name: Mnyororo wa kwanza (baiti 393 -> mbegu, kusanyiko, mjenzi)
        run: ./msingi/mjenzi.bin gharama/mfululizo.mapishi

      - name: Mnyororo huru (hatua zinazojengwa kutoka baiti 393 pekee)
        run: ./msingi/mjenzi.bin gharama/jaribu-mfululizo-huru.mapishi

      - name: Mnyororo kamili wa majaribio
        run: ./msingi/mjenzi.bin gharama/jaribu-mfululizo.mapishi

      - name: Mifano ya README (msimbo wa ukurasa wa mbele lazima ufanye kazi)
        run: ./msingi/mjenzi.bin gharama/jaribu-mifano.mapishi

      - name: Usakinishaji (swa nje ya hazina hupata maktaba yake)
        run: ./msingi/mjenzi.bin gharama/jaribu-usakinishaji.mapishi

      - name: Msuluhishi wa husisha (grafu kamili, mzunguko, makosa)
        run: ./msingi/mjenzi.bin gharama/jaribu-msuluhishi.mapishi

      - name: IR ya mstari (mtafsiri dhidi ya msimbo wa mashine)
        run: ./msingi/mjenzi.bin gharama/jaribu-ir.mapishi

      - name: Daraja la mashine (kazi za nje kupitia kipakiaji cha mfumo)
        run: ./msingi/mjenzi.bin gharama/jaribu-kiolesura.mapishi

      - name: WebAssembly (node kama oracle)
        run: ./msingi/mjenzi.bin gharama/jaribu-wasm.mapishi

      - name: Zana za --kiini
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86

      # KVM ikikosekana, oracle.py hutumia tcg (polepole lakini sahihi).
      - name: --kiini (ring 0, QEMU)
        run: ./msingi/mjenzi.bin gharama/jaribu-kernel.mapishi
